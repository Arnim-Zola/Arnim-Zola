<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Seamless GitHub Obsidian to Dark Emerald Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B0F" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0A1510" />
    </linearGradient>

    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0" />
      <stop offset="25%" stop-color="#238636" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#39D353" />
      <stop offset="75%" stop-color="#00FF66" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F6FC" />
      <stop offset="100%" stop-color="#39D353" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Cyber Matrix Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#238636" stroke-width="0.5" stroke-opacity="0.12" />
      <circle cx="0" cy="0" r="1" fill="#39D353" fill-opacity="0.25" />
    </pattern>

    <style>
      .glow-pulse {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .laser-scan {
        animation: scanMove 6s linear infinite;
      }
      .beam-dash {
        stroke-dasharray: 120 400;
        animation: dashFlow 5s linear infinite;
      }
      .node-twinkle {
        animation: twinkle 3s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.55; }
        100% { opacity: 0.95; filter: drop-shadow(0 0 22px rgba(57, 211, 83, 0.45)); }
      }
      @keyframes scanMove {
        0% { transform: translateX(-900px); }
        100% { transform: translateX(900px); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 520; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.8); }
        100% { opacity: 0.9; transform: scale(1.3); }
      }
    </style>
  </defs>

  <!-- Base Card Frame with Seamless Rounded Borders -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad)" stroke="#238636" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Background Cyber Grid -->
  <rect x="6" y="6" width="888" height="228" rx="14" fill="url(#grid)" />

  <!-- Subtle Radial Ambient Glow Behind Name -->
  <circle cx="450" cy="115" r="140" fill="#238636" fill-opacity="0.1" filter="url(#strongGlow)" />
  <circle cx="450" cy="115" r="70" fill="#39D353" fill-opacity="0.14" filter="url(#glow)" />

  <!-- Animated Neon Edge Circuit Trace -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="none" stroke="url(#neonLine)" stroke-width="2" class="beam-dash" />

  <!-- Corner HUD Tech Brackets -->
  <g stroke="#39D353" stroke-width="1.8" stroke-opacity="0.75" fill="none">
    <!-- Top Left -->
    <path d="M 22 42 L 22 22 L 42 22" />
    <circle cx="22" cy="22" r="2.5" fill="#39D353" />
    <!-- Top Right -->
    <path d="M 878 42 L 878 22 L 858 22" />
    <circle cx="878" cy="22" r="2.5" fill="#39D353" />
    <!-- Bottom Left -->
    <path d="M 22 198 L 22 218 L 42 218" />
    <circle cx="22" cy="218" r="2.5" fill="#39D353" />
    <!-- Bottom Right -->
    <path d="M 878 198 L 878 218 L 858 218" />
    <circle cx="878" cy="218" r="2.5" fill="#39D353" />
  </g>

  <!-- Dynamic Constellation Nodes -->
  <circle cx="160" cy="65" r="2" fill="#39D353" class="node-twinkle" style="animation-delay: 0.2s;" />
  <circle cx="210" cy="175" r="1.5" fill="#00FF66" class="node-twinkle" style="animation-delay: 1.1s;" />
  <circle cx="730" cy="70" r="2" fill="#39D353" class="node-twinkle" style="animation-delay: 0.7s;" />
  <circle cx="690" cy="180" r="1.8" fill="#00FF66" class="node-twinkle" style="animation-delay: 1.6s;" />

  <!-- Top Status Pill with Real Meaningful Title -->
  <g transform="translate(450, 48)">
    <rect x="-140" y="-12" width="280" height="22" rx="11" fill="#161B22" stroke="#238636" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="-120" cy="-1" r="3.5" fill="#39D353">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-106" y="3" fill="#39D353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace" font-size="10" font-weight="700" letter-spacing="1.2">AI &amp; FULL-STACK SYSTEMS ENGINEER</text>
  </g>

  <!-- Central Hero Name -->
  <g transform="translate(450, 118)" text-anchor="middle">
    <!-- Glow Backdrop for Name -->
    <text x="0" y="0" fill="#39D353" opacity="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="8" filter="url(#strongGlow)">MOHAMMED SAHIL</text>
    <!-- Crisp Foreground Text -->
    <text x="0" y="0" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="8">MOHAMMED SAHIL</text>
  </g>

  <!-- Accent Divider with Central Diamond -->
  <g transform="translate(450, 142)">
    <line x1="-190" y1="0" x2="-25" y2="0" stroke="url(#neonLine)" stroke-width="1.5" />
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#39D353" filter="url(#glow)" />
    <line x1="25" y1="0" x2="190" y2="0" stroke="url(#neonLine)" stroke-width="1.5" />
  </g>

  <!-- Core Subtitle / Engineering Identity -->
  <g transform="translate(450, 172)" text-anchor="middle">
    <text x="0" y="0" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace" font-size="13" font-weight="600" letter-spacing="3">
      FULL-STACK <tspan fill="#39D353">•</tspan> GENAI SYSTEMS <tspan fill="#39D353">•</tspan> MULTIMODAL AI
    </text>
  </g>

  <!-- Bottom Terminal Tagline -->
  <g transform="translate(450, 198)" text-anchor="middle">
    <text x="0" y="0" fill="#56D364" fill-opacity="0.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', monospace" font-size="11" font-weight="500" letter-spacing="1.8">
      BUILDING EDEN // MULTIMODAL FORENSIC PIPELINES // BENGALURU, IN
    </text>
  </g>

  <!-- High-Tech Animated Scanner Beam Across the Banner Bottom -->
  <g transform="translate(0, 224)">
    <line x1="20" y1="0" x2="880" y2="0" stroke="#161B22" stroke-width="1" />
    <rect x="0" y="-1" width="140" height="2" fill="url(#neonLine)" class="laser-scan" filter="url(#glow)" />
  </g>
</svg>

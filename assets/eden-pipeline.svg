<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%">
  <defs>
    <!-- Base Fonts & Keyframes -->
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Caacupe+One&display=swap');

      .pipe-title { font-family: 'Caacupe One', cursive, sans-serif; letter-spacing: 2px; }
      .pipe-mono { font-family: 'JetBrains Mono', monospace; }
      
      /* Circuit Flow Animation */
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.12); opacity: 1; filter: drop-shadow(0 0 8px #00ff66); }
      }
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes waveBars {
        0%, 100% { height: 4px; }
        50% { height: 12px; }
      }

      .flow-line {
        stroke-dasharray: 6 5;
        animation: dashFlow 1.2s linear infinite;
      }
      .node-pulse {
        animation: pulseNode 2.5s ease-in-out infinite;
        transform-origin: center;
      }
      .radar-spin {
        animation: radarRotate 6s linear infinite;
        transform-origin: center;
      }
      
      .node-box {
        transition: transform 0.25s ease, filter 0.25s ease;
      }
      .node-box:hover {
        filter: drop-shadow(0 0 14px rgba(0,255,102,0.5));
      }
    ]]></style>

    <!-- Obsidian & Emerald Gradients -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040906" />
      <stop offset="50%" stop-color="#06120a" />
      <stop offset="100%" stop-color="#030705" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e2617" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#05130a" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="cardHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0" />
      <stop offset="50%" stop-color="#00ff66" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1b4d2e" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="24" cy="0" r="1" fill="#00ff66" fill-opacity="0.2" />
    </pattern>

    <!-- Scanline overlay -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" fill-opacity="0.35" />
    </pattern>

    <!-- Directional Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00ff66" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="980" height="440" rx="14" fill="url(#cyberBg)" stroke="#1b4d2e" stroke-width="1.5" />
  <rect width="980" height="440" rx="14" fill="url(#gridPattern)" />
  <rect width="980" height="440" rx="14" fill="url(#scanlines)" pointer-events="none" />

  <!-- Top HUD Telemetry Bar -->
  <rect x="0" y="0" width="980" height="38" rx="14" fill="#07170d" fill-opacity="0.92" stroke="#1b4d2e" stroke-width="1" />
  <rect x="0" y="24" width="980" height="14" fill="#07170d" />
  <line x1="0" y1="38" x2="980" y2="38" stroke="#1b4d2e" stroke-width="1" />

  <g class="pipe-mono" font-size="10" font-weight="700">
    <text x="24" y="24" fill="#00ff66" letter-spacing="2">SYS.ARCH</text>
  </g>

  <!-- ============================================================
       CONNECTING DATA BUS & CIRCUITS (Behind Nodes)
       ============================================================ -->
  <g fill="none" stroke-linecap="round">
    <!-- Main Ingestion Bus split to Top/Bottom -->
    <path d="M 180 230 L 212 230 L 212 145 L 245 145" stroke="#00ff66" stroke-width="2" class="flow-line" marker-end="url(#arrow)" />
    <path d="M 180 230 L 212 230 L 212 315 L 245 315" stroke="#00ff66" stroke-width="2" class="flow-line" marker-end="url(#arrow)" />

    <!-- Top: OpenCV to EasyOCR -->
    <path d="M 355 145 L 390 145" stroke="#00ff66" stroke-width="2" class="flow-line" marker-end="url(#arrow)" />
    <!-- Bottom: Whisper to Claims -->
    <path d="M 355 315 L 390 315" stroke="#00ff66" stroke-width="2" class="flow-line" marker-end="url(#arrow)" />

    <!-- Converge to Temporal Fusion Core (Both Lines Meet in Center at y=230) -->
    <path d="M 505 145 L 535 145 L 535 230 L 565 230" stroke="#00ff66" stroke-width="2" class="flow-line" marker-end="url(#arrow)" />
    <path d="M 505 315 L 535 315 L 535 230 L 565 230" stroke="#00ff66" stroke-width="2" class="flow-line" marker-end="url(#arrow)" />

    <!-- Fusion to OSINT Agent -->
    <path d="M 675 230 L 710 230" stroke="#00ff66" stroke-width="2" class="flow-line" marker-end="url(#arrow)" />

    <!-- OSINT Agent to Final Forensic Truth Dossier -->
    <path d="M 815 230 L 850 230" stroke="#00ff66" stroke-width="2" class="flow-line" marker-end="url(#arrow)" />
  </g>

  <!-- ============================================================
       STAGE 1: STREAM INGESTION CORE
       ============================================================ -->
  <g transform="translate(25, 155)" class="node-box">
    <rect width="155" height="150" rx="10" fill="url(#cardGrad)" stroke="#1b4d2e" stroke-width="1.5" />
    <rect x="0" y="0" width="155" height="3" fill="url(#cardHighlight)" />
    
    <!-- Stage Pill -->
    <rect x="12" y="12" width="62" height="16" rx="4" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="1" />
    <text x="43" y="24" class="pipe-mono" font-size="8.5" font-weight="700" fill="#00ff66" text-anchor="middle">STAGE 01</text>
    
    <!-- Title & Layman Headline -->
    <text x="12" y="46" class="pipe-mono" font-size="12" font-weight="700" fill="#ffffff">STREAM INGEST</text>
    <text x="12" y="58" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66" letter-spacing="0.5">QUEUES VIDEO SAFELY</text>
    <text x="12" y="69" class="pipe-mono" font-size="7" fill="#c0d4c8">Ingests media without crash</text>
    
    <!-- Streams List -->
    <g transform="translate(12, 77)" class="pipe-mono" font-size="8">
      <rect width="131" height="18" rx="3.5" fill="#07150c" stroke="#1b4d2e" stroke-width="1" />
      <circle cx="9" cy="9" r="2.5" fill="#00ff66" />
      <text x="18" y="12.5" fill="#e6edf3">Instagram Reels</text>
      <text x="123" y="12.5" fill="#00ff66" font-size="7.5" font-weight="700" text-anchor="end">LIVE</text>

      <rect y="23" width="131" height="18" rx="3.5" fill="#07150c" stroke="#1b4d2e" stroke-width="1" />
      <circle cx="9" cy="32" r="2.5" fill="#00ff66" />
      <text x="18" y="35.5" fill="#e6edf3">Post Carousels</text>
      <text x="123" y="35.5" fill="#00ff66" font-size="7.5" font-weight="700" text-anchor="end">SCAN</text>

      <rect y="46" width="131" height="18" rx="3.5" fill="#07150c" stroke="#1b4d2e" stroke-width="1" />
      <circle cx="9" cy="55" r="2.5" fill="#00ff66" />
      <text x="18" y="58.5" fill="#e6edf3">Raw Video MP4</text>
      <text x="123" y="58.5" fill="#00ff66" font-size="7.5" font-weight="700" text-anchor="end">ASYNC</text>
    </g>
  </g>

  <!-- ============================================================
       STAGE 2A: TOP VISUAL PIPELINE (OpenCV + EasyOCR)
       ============================================================ -->
  <!-- Box A1: OpenCV -->
  <g transform="translate(245, 95)" class="node-box">
    <rect width="110" height="100" rx="8" fill="url(#cardGrad)" stroke="#1b4d2e" stroke-width="1.5" />
    <rect x="0" y="0" width="110" height="2.5" fill="url(#cardHighlight)" />
    
    <rect x="10" y="9" width="52" height="14" rx="3" fill="#00ff66" fill-opacity="0.12" stroke="#00ff66" stroke-width="0.8" />
    <text x="36" y="19.5" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66" text-anchor="middle">VISUAL A1</text>
    
    <text x="10" y="38" class="pipe-mono" font-size="11" font-weight="700" fill="#ffffff">OpenCV</text>
    <text x="10" y="50" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">FRAME SLICER</text>
    
    <!-- Layman Description Pill -->
    <rect x="8" y="58" width="94" height="34" rx="4" fill="#051009" stroke="#1b4d2e" stroke-width="0.8" />
    <text x="12" y="70" class="pipe-mono" font-size="7.5" fill="#e6edf3">Splits video into</text>
    <text x="12" y="82" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">4 images / second</text>
  </g>

  <!-- Box A2: EasyOCR -->
  <g transform="translate(390, 95)" class="node-box">
    <rect width="115" height="100" rx="8" fill="url(#cardGrad)" stroke="#1b4d2e" stroke-width="1.5" />
    <rect x="0" y="0" width="115" height="2.5" fill="url(#cardHighlight)" />
    
    <rect x="10" y="9" width="52" height="14" rx="3" fill="#00ff66" fill-opacity="0.12" stroke="#00ff66" stroke-width="0.8" />
    <text x="36" y="19.5" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66" text-anchor="middle">VISUAL A2</text>
    
    <text x="10" y="38" class="pipe-mono" font-size="11" font-weight="700" fill="#ffffff">EasyOCR</text>
    <text x="10" y="50" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">ON-SCREEN TEXT</text>
    
    <!-- Layman Description Pill -->
    <rect x="8" y="58" width="99" height="34" rx="4" fill="#051009" stroke="#1b4d2e" stroke-width="0.8" />
    <text x="12" y="70" class="pipe-mono" font-size="7.5" fill="#e6edf3">Reads captions &amp;</text>
    <text x="12" y="82" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">burned subtitles</text>
  </g>

  <!-- ============================================================
       STAGE 2B: BOTTOM AUDITORY PIPELINE (Whisper + Claims)
       ============================================================ -->
  <!-- Box B1: Whisper -->
  <g transform="translate(245, 265)" class="node-box">
    <rect width="110" height="100" rx="8" fill="url(#cardGrad)" stroke="#1b4d2e" stroke-width="1.5" />
    <rect x="0" y="0" width="110" height="2.5" fill="url(#cardHighlight)" />
    
    <rect x="10" y="9" width="52" height="14" rx="3" fill="#00ff66" fill-opacity="0.12" stroke="#00ff66" stroke-width="0.8" />
    <text x="36" y="19.5" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66" text-anchor="middle">AUDIO B1</text>
    
    <text x="10" y="38" class="pipe-mono" font-size="11" font-weight="700" fill="#ffffff">Whisper</text>
    <text x="10" y="50" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">SPEECH-TO-TEXT</text>
    
    <!-- Layman Description Pill -->
    <rect x="8" y="58" width="94" height="34" rx="4" fill="#051009" stroke="#1b4d2e" stroke-width="0.8" />
    <text x="12" y="70" class="pipe-mono" font-size="7.5" fill="#e6edf3">Converts spoken</text>
    <text x="12" y="82" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">voices to text</text>
  </g>

  <!-- Box B2: Claim Slicer -->
  <g transform="translate(390, 265)" class="node-box">
    <rect width="115" height="100" rx="8" fill="url(#cardGrad)" stroke="#1b4d2e" stroke-width="1.5" />
    <rect x="0" y="0" width="115" height="2.5" fill="url(#cardHighlight)" />
    
    <rect x="10" y="9" width="52" height="14" rx="3" fill="#00ff66" fill-opacity="0.12" stroke="#00ff66" stroke-width="0.8" />
    <text x="36" y="19.5" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66" text-anchor="middle">AUDIO B2</text>
    
    <text x="10" y="38" class="pipe-mono" font-size="11" font-weight="700" fill="#ffffff">Claim Slicer</text>
    <text x="10" y="50" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">FACT FINDER</text>
    
    <!-- Layman Description Pill -->
    <rect x="8" y="58" width="99" height="34" rx="4" fill="#051009" stroke="#1b4d2e" stroke-width="0.8" />
    <text x="12" y="70" class="pipe-mono" font-size="7.5" fill="#e6edf3">Finds statements</text>
    <text x="12" y="82" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">to fact-check</text>
  </g>

  <!-- ============================================================
       STAGE 3: TEMPORAL FUSION & CROSS-MODAL ALIGNMENT
       ============================================================ -->
  <g transform="translate(565, 155)" class="node-box">
    <rect width="110" height="150" rx="10" fill="url(#cardGrad)" stroke="#1b4d2e" stroke-width="1.5" />
    <rect x="0" y="0" width="110" height="3" fill="url(#cardHighlight)" />
    
    <rect x="10" y="12" width="60" height="16" rx="4" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="1" />
    <text x="40" y="24" class="pipe-mono" font-size="8" font-weight="700" fill="#00ff66" text-anchor="middle">STAGE 03</text>
    
    <text x="10" y="46" class="pipe-mono" font-size="11" font-weight="700" fill="#ffffff">TEMPORAL</text>
    <text x="10" y="58" class="pipe-mono" font-size="11" font-weight="700" fill="#ffffff">FUSION</text>
    <text x="10" y="71" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">SYNC TRACKS</text>
    
    <text x="10" y="82" class="pipe-mono" font-size="6.8" fill="#c0d4c8">Matches voice to</text>
    <text x="10" y="91" class="pipe-mono" font-size="6.8" fill="#c0d4c8">exact video seconds</text>

    <!-- Visual Central Fusion Aperture -->
    <g transform="translate(55, 122)">
      <circle cx="0" cy="0" r="19" fill="#040e07" stroke="#1b4d2e" stroke-width="1.5" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00ff66" stroke-width="1.2" stroke-dasharray="4 3" class="node-pulse" />
      <polygon points="0,-7 6,4 -6,4" fill="#00ff66" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- ============================================================
       STAGE 4: MULTI-AGENT OSINT ENGINE (Real-Time News Evidence)
       ============================================================ -->
  <g transform="translate(710, 155)" class="node-box">
    <rect width="105" height="150" rx="10" fill="url(#cardGrad)" stroke="#1b4d2e" stroke-width="1.5" />
    <rect x="0" y="0" width="105" height="3" fill="url(#cardHighlight)" />
    
    <rect x="10" y="12" width="58" height="16" rx="4" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="1" />
    <text x="39" y="24" class="pipe-mono" font-size="8" font-weight="700" fill="#00ff66" text-anchor="middle">STAGE 04</text>
    
    <text x="10" y="46" class="pipe-mono" font-size="11" font-weight="700" fill="#ffffff">OSINT</text>
    <text x="10" y="58" class="pipe-mono" font-size="11" font-weight="700" fill="#ffffff">ENGINE</text>
    <text x="10" y="71" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">NEWS CHECK</text>

    <!-- Layman & Tech Breakdown -->
    <g transform="translate(10, 79)" class="pipe-mono" font-size="7.2">
      <rect width="85" height="29" rx="3" fill="#051009" stroke="#1b4d2e" stroke-width="0.8" />
      <text x="6" y="12" fill="#e6edf3">Cross-checks real</text>
      <text x="6" y="22" fill="#00ff66" font-weight="700">verified news</text>

      <rect y="34" width="85" height="24" rx="3" fill="#051009" stroke="#1b4d2e" stroke-width="0.8" />
      <text x="6" y="45" fill="#c0d4c8">Fast vector search</text>
      <text x="6" y="53" fill="#00ff66" font-weight="600">&lt; 120ms latency</text>
    </g>
  </g>

  <!-- ============================================================
       STAGE 5: FORENSIC TRUTH DOSSIER (EXACT 105px x 150px - MATCHING STAGE 4)
       ============================================================ -->
  <g transform="translate(850, 155)" class="node-box">
    <rect width="105" height="150" rx="10" fill="url(#cardGrad)" stroke="#1b4d2e" stroke-width="1.5" />
    <rect x="0" y="0" width="105" height="3" fill="url(#cardHighlight)" />
    
    <rect x="10" y="12" width="58" height="16" rx="4" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="1" />
    <text x="39" y="24" class="pipe-mono" font-size="8" font-weight="700" fill="#00ff66" text-anchor="middle">STAGE 05</text>
    
    <text x="10" y="46" class="pipe-mono" font-size="11" font-weight="700" fill="#ffffff">TRUTH</text>
    <text x="10" y="58" class="pipe-mono" font-size="11" font-weight="700" fill="#ffffff">INDEX %</text>
    <text x="10" y="71" class="pipe-mono" font-size="7.5" font-weight="700" fill="#00ff66">FINAL VERDICT</text>

    <!-- Circular Authenticity Telemetry Gauge -->
    <g transform="translate(52.5, 102)">
      <circle cx="0" cy="0" r="21" fill="#040e07" stroke="#1b4d2e" stroke-width="1.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1b4d2e" stroke-width="2.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#00ff66" stroke-width="2.8" stroke-dasharray="85 18" stroke-linecap="round" />
      <text x="0" y="3" class="pipe-mono" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">94%</text>
      <text x="0" y="10.5" class="pipe-mono" font-size="4.5" font-weight="700" fill="#00ff66" letter-spacing="0.5" text-anchor="middle">AUTHENTIC</text>
    </g>

    <!-- Layman Description Pill -->
    <rect x="10" y="127" width="85" height="16" rx="3" fill="#051009" stroke="#1b4d2e" stroke-width="0.8" />
    <text x="13" y="138.5" class="pipe-mono" font-size="6.8" fill="#c0d4c8">Scores credibility</text>
  </g>
</svg>
